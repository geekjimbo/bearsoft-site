name = "bearsoft-connect"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
account_id = "8ca49d69c1be19f026a4ee0b1e48a7df"

[vars]
SITE_URL = "https://bearsoft.ai/"

# Secrets, set once with `npx wrangler secret put <NAME>` (never commit them):
#   GITHUB_CLIENT_ID      from the "Bearsoft" OAuth App in the bearsoft-ai GitHub org
#   GITHUB_CLIENT_SECRET  same app
#   COOKIE_SECRET         any long random string (e.g. `openssl rand -base64 48`)
#   SHEET_WEBHOOK_URL     the Apps Script web app URL (ends in /exec)
#   SHEET_SECRET          the same random string stored as SHARED_SECRET in Apps Script
